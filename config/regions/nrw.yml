region_name: Nordrhein-Westfalen
region_abbr: NRW
country: Germany
case_study_title: Geospatial EV Charging Infrastructure Intelligence Platform for NRW
nuts1: DEA
ags_prefix: "05"
analysis_level: NUTS-3 / Kreis
projected_crs: EPSG:25832
web_crs: EPSG:4326
default_map_center: [51.43, 7.66]
default_map_zoom: 7
default_bounds: [5.86, 50.32, 9.47, 52.53]
spatial_buffer_km: 10
major_road_classes:
  - motorway
  - trunk
  - primary
  - secondary
# Strassen.NRW supplies STRKL source classes, not OpenStreetMap highway values.
# staging.normalize_road_class in db/nrw_schema.sql applies this mapping before
# major_road_classes is compared, so the accessibility layer is not empty.
road_class_source_mapping:
  - A=motorway
  - B=primary
  - L=secondary
  - K=tertiary
frontend_region_file: data/runtime/current/nrw_regions_sample.geojson
frontend_charger_file: data/runtime/current/nrw_charging_stations_sample.geojson
raw_nuts3_path: data/raw/nuts3_regions_gisco_2024.geojson
raw_bnetza_path: data/raw/bnetza_ladesaeulenregister.csv
