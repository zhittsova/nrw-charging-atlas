server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;
    types {
        application/geo+json geojson;
    }

    root /usr/share/nginx/html;
    index index.html;

    # The app shell names fingerprinted assets, but is itself the SPA fallback.
    # Never allow a client to reuse an old shell after a frontend-only release:
    # it could otherwise reference a withdrawn asset bundle and hide accepted UI
    # corrections until the user manually reloads.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        add_header Cache-Control "no-cache";
        alias /usr/share/nginx/html/runtime/current/;
    }

    location /geoserver/ {
        # A literal host in proxy_pass is resolved once, at startup. That made nginx
        # refuse to boot while GeoServer was still absent, and made it keep proxying to
        # a stale address after GeoServer was recreated on a new IP, answering 502 for
        # an otherwise healthy backend. Resolving through Docker's embedded DNS at
        # request time fixes both. A variable in proxy_pass also suppresses nginx's
        # usual URI rewriting, so the upstream URI is passed explicitly; this location
        # prefix and the upstream path are both /geoserver/, so $request_uri reproduces
        # the previous mapping exactly, query string included.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $geoserver_upstream http://geoserver:8080;
        proxy_pass $geoserver_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
