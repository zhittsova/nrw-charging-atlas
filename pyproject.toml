[project]
name = "nrw-energy-infrastructure-intelligence"
version = "0.1.0"
description = "Real data pipeline and dashboard MVP for NRW energy infrastructure intelligence."
requires-python = ">=3.11"
dependencies = [
  "geopandas>=0.14",
  "openpyxl>=3.1.5",
  "pandas>=2.2",
  "pyarrow>=15",
  "python-dotenv>=1.0",
  "requests>=2.31",
  # Used directly by scripts/nrw_charger_quality.py for GEOS topology validation.
  "shapely>=2.0",
]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start with errors that can make a command invalid or change its runtime
# meaning.  The existing codebase predates a formatter and has broader style
# debt; expanding this set belongs in a dedicated cleanup, not in CI setup.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    # Independent EPSG:25832 oracle for the spatial regression fixtures.
    "pyproj>=3.6",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
