[project]
name = "nrw-energy-infrastructure-intelligence"
version = "0.1.0"
description = "Real data pipeline and dashboard MVP for NRW energy infrastructure intelligence."
requires-python = ">=3.11"
dependencies = [
  "geopandas>=0.14",
  "openpyxl>=3.1.5",
  "pandas>=2.2",
  "pyarrow>=15",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "streamlit>=1.36",
]


[tool.ruff]
line-length = 120
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
