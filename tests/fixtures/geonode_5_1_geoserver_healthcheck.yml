# Compact upstream contract fixture, copied from GeoNode 5.1.0 (pinned by
# config/geonode-upstream.json).  It deliberately contains only the service
# fragment whose timing the NRW override extends; it is not a deployable Compose
# file and never substitutes for the ignored upstream checkout.
geoserver:
  healthcheck:
    test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://geoserver:8080/geoserver/ows"
    start_period: 60s
    interval: 60s
    timeout: 10s
    retries: 2
